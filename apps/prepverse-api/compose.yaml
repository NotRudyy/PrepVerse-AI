services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prepverse
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: prepverse
    ports: ["5433:5432"]
    volumes: ["prepverse_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepverse -d prepverse"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    environment:
      PREPVERSE_DATABASE_URL: postgresql+psycopg://prepverse:local-only-change-me@database:5432/prepverse
    ports: ["8001:8001"]
    depends_on:
      database: { condition: service_healthy }
volumes:
  prepverse_data:
